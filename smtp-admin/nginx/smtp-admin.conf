# MuktoPay SMTP Admin Portal
# HTTPS reverse proxy to Uvicorn on port 8080

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name mpsmtp01.muktopay.com;

    ssl_certificate     /etc/postfix/tls/mpsmtp01.muktopay.com.crt;
    ssl_certificate_key /etc/postfix/tls/mpsmtp01.muktopay.com.key;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name mpsmtp01.muktopay.com;

    return 301 https://$host$request_uri;
}