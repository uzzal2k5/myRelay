<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L10,3 L0,6 Z" fill="#334155"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".14"/>
  </filter>
</defs>
<rect width="1400" height="850" fill="#f8fafc"/>
<text x="700" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">
SMTP Admin Dashboard — Existing Postfix Configuration Model
</text>
<text x="700" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">
No parallel policy database or /etc/postfix/policy hierarchy
</text>

<!-- Browser -->
<rect x="70" y="160" width="240" height="115" rx="14" fill="#fff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
<text x="190" y="195" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Admin Browser</text>
<text x="190" y="225" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">HTTPS / RBAC</text>
<text x="190" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">SMTP Admin / Security / Read Only</text>

<!-- AD -->
<rect x="70" y="350" width="240" height="115" rx="14" fill="#fff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
<text x="190" y="385" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">On-Prem AD</text>
<text x="190" y="415" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">LDAP / LDAPS</text>
<text x="190" y="440" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">MP-SMTP-Users</text>

<!-- Nginx -->
<rect x="390" y="160" width="210" height="115" rx="14" fill="#fff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
<text x="495" y="200" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Nginx</text>
<text x="495" y="230" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">TLS termination</text>
<text x="495" y="255" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Reverse proxy</text>

<!-- FastAPI -->
<rect x="670" y="145" width="280" height="145" rx="14" fill="#fff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
<text x="810" y="185" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">FastAPI Dashboard</text>
<text x="810" y="215" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">Jinja2 + HTMX + Bootstrap</text>
<text x="810" y="242" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Authentication / RBAC / Audit</text>
<text x="810" y="267" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Controlled management APIs</text>

<!-- Redis -->
<rect x="1040" y="145" width="270" height="145" rx="14" fill="#fff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
<text x="1175" y="185" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">Redis 6.2.x</text>
<text x="1175" y="215" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">Existing SMTP policy data</text>
<text x="1175" y="242" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Rate limits / application policies</text>
<text x="1175" y="267" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Controlled smtp:* keys only</text>

<!-- Existing Postfix config -->
<rect x="390" y="430" width="280" height="190" rx="14" fill="#fff" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/>
<text x="530" y="470" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Existing Postfix</text>
<text x="530" y="500" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">/etc/postfix/main.cf</text>
<text x="530" y="528" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Current restriction chains</text>
<text x="530" y="556" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">smtpd_*_restrictions</text>
<text x="530" y="584" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Existing map references</text>

<!-- Existing maps -->
<rect x="760" y="410" width="300" height="230" rx="14" fill="#fff" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/>
<text x="910" y="450" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Existing Map Files</text>
<text x="910" y="485" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">/etc/postfix/access</text>
<text x="910" y="515" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">/etc/postfix/sender_access</text>
<text x="910" y="545" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">/etc/postfix/recipient_access</text>
<text x="910" y="575" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">/etc/postfix/virtual / transport</text>
<text x="910" y="605" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Existing PCRE/regexp maps</text>

<!-- helper -->
<rect x="1110" y="430" width="200" height="190" rx="14" fill="#fff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
<text x="1210" y="470" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Privileged Helper</text>
<text x="1210" y="500" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Fixed commands only</text>
<text x="1210" y="530" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">postmap</text>
<text x="1210" y="558" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">postfix check</text>
<text x="1210" y="586" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">postfix reload</text>

<!-- Backup -->
<rect x="760" y="700" width="300" height="80" rx="14" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="910" y="733" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Timestamped Backups</text>
<text x="910" y="758" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">/etc/postfix/backup</text>

<!-- arrows -->
<line x1="310" y1="217" x2="390" y2="217" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="600" y1="217" x2="670" y2="217" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="190" y1="350" x2="190" y2="275" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="950" y1="217" x2="1040" y2="217" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="760" y1="285" x2="600" y2="430" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="810" y1="290" x2="910" y2="410" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="950" y1="515" x2="1110" y2="515" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="670" y1="525" x2="760" y2="525" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="910" y1="640" x2="910" y2="700" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

<!-- workflow -->
<rect x="70" y="700" width="600" height="80" rx="14" fill="#e2e8f0"/>
<text x="370" y="730" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">
Existing Map → Backup → Atomic Update → postmap → postfix check → reload → Audit
</text>
<text x="370" y="757" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">
Failure at validation/reload triggers restoration of the previous map
</text>
</svg>