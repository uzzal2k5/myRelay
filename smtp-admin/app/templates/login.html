<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — My Relay</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<div class="login-page">
    <div class="login-card">

        <div class="login-brand">
            <svg class="login-brand-mark" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00D9FF"/>
                        <stop offset="100%" stop-color="#1D9BD8"/>
                    </linearGradient>
                </defs>
                <polygon points="50,0 190,0 240,50 240,190 190,240 50,240 0,190 0,50" fill="#0A1930"/>
                <rect x="40" y="88" width="110" height="64" rx="8" fill="none" stroke="#FFFFFF" stroke-width="6"/>
                <path d="M40,94 L95,128 L150,94" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M172,86 L208,120 L172,154" fill="none" stroke="#00D9FF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"/>
                <path d="M172,86 L208,120 L172,154" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="208" cy="120" r="5" fill="#00D9FF"/>
                <path d="M196,98 L222,120 L196,142" fill="none" stroke="#1D9BD8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
            </svg>

            <div class="login-brand-text">
                <div class="login-brand-title">My Relay</div>
                <div class="login-brand-subtitle">SMTP PORTAL</div>
            </div>
        </div>

        <p class="login-tagline">Sign in with your Active Directory account to continue.</p>

        {% if request.query_params.get("logged_out") == "1" %}
        <div class="login-alert is-success">
            <i class="bi bi-check-circle-fill"></i>
            <span>You've been signed out.</span>
        </div>
        {% endif %}

        {% if error %}
        <div class="login-alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" class="login-form">

            <div class="login-field">
                <label for="username">AD Username</label>
                <div class="login-input-wrapper">
                    <i class="bi bi-person-fill"></i>
                    <input
                            id="username"
                            name="username"
                            type="text"
                            autocomplete="username"
                            placeholder="uzzal"
                            required
                            autofocus>
                </div>
            </div>

            <div class="login-field">
                <label for="password">Password</label>
                <div class="login-input-wrapper">
                    <i class="bi bi-lock-fill"></i>
                    <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="••••••••"
                            required>
                </div>
            </div>

            <button type="submit" class="login-submit">
                Sign in
                <i class="bi bi-arrow-right"></i>
            </button>

        </form>

        <div class="login-footer">
            Access is restricted to authorized AD security groups.
        </div>

    </div>
</div>

</body>
</html>
